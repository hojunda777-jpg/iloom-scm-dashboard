<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>누적재고관리 | iloom SCM 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--brand:#c80a1e;--text:#333;--text-sub:#999;--border:#E0E0E0;--bg:#fff;--bg-alt:#F8F8F8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Montserrat',sans-serif;background:var(--bg-alt);color:var(--text);font-size:14px;letter-spacing:-0.2px;line-height:1.6}
.page-wrap{max-width:1600px;margin:0 auto;padding:24px 16px}
.cm-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);padding:16px 20px}
.cm-header .logo{font-family:Montserrat,sans-serif;font-weight:700;font-size:22px;color:var(--brand);letter-spacing:-0.5px}
.cm-header .logo .sub{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:14px;color:var(--text);margin-left:10px}
.cm-header h1{font-size:18px;font-weight:700;margin-right:auto;color:var(--text)}
.cm-header .meta{font-size:11px;color:var(--text-sub);margin-left:auto;font-family:Montserrat,sans-serif;text-align:right;line-height:1.5}
.cm-header .meta strong{color:var(--text)}
.cm-status{background:var(--bg);border-left:4px solid var(--brand);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text)}
.notice{font-size:11.5px;color:var(--brand);background:#fdf2f3;border:1px solid #fad1d5;padding:6px 10px;margin-bottom:14px;display:inline-block}

.cm-tabs{display:flex;gap:0;margin-bottom:0;border-bottom:1px solid var(--border);background:#fff;padding:0 8px}
.cm-tab{padding:12px 22px;background:transparent;border:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-sub);transition:.15s;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.cm-tab:hover{color:var(--brand)}
.cm-tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.cm-panel{display:none;background:#fff;padding:18px 20px;border:1px solid var(--border);border-top:none}
.cm-panel.active{display:block}

/* 카테고리 pill */
.cat-g1{display:inline-block;padding:2px 10px;border-radius:3px;font-size:11px;font-weight:600}
.g1-재고소진{background:#FFEFEF;color:var(--brand)}
.g1-단종예정{background:#FFF4E5;color:#cc7a00}
.g1-단종검토{background:#FFFBE5;color:#998800}
.g1-폐기{background:#EEE;color:#555}

/* 종합 테이블 */
table.cum-table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.cum-table th,.cum-table td{padding:9px 12px;text-align:right;border-bottom:1px solid #eee;white-space:nowrap}
.cum-table th{background:var(--bg-alt);color:var(--text);font-weight:600;text-align:center;border-bottom:2px solid var(--brand)}
.cum-table td.left,.cum-table th.left{text-align:left}
.cum-table tr.row-grp-0:hover,.cum-table tr.row-grp-1:hover{background:#FFF8F8;cursor:pointer}
.cum-table tr.row-grp-0{background:#fff}
.cum-table tr.row-grp-1{background:#FCFCFC}
.cum-table tr.row-subtotal td{font-weight:600;background:#F4F4F4;color:#666;border-top:1px dashed #ccc}
.cum-table tr.row-total td{font-weight:700;background:var(--bg-alt);border-top:2px solid var(--brand)}

/* 상세 시트 */
.cd-toolbar{margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cd-toolbar input[type=text]{flex:1;max-width:360px;padding:6px 10px;border:1px solid var(--border);font-size:13px;font-family:inherit}
.cd-toolbar input[type=text]:focus{outline:none;border-color:var(--brand)}
.cd-btn{padding:6px 12px;border:1px solid var(--brand);background:#fff;color:var(--brand);font-size:12px;cursor:pointer;font-weight:600;font-family:inherit}
.cd-btn:hover{background:var(--brand);color:#fff}
.cd-btn.ghost{border-color:#999;color:#666}
.cd-btn.ghost:hover{background:#666;color:#fff}
.cd-layout{display:grid;grid-template-columns:240px 1fr;gap:16px}
.cd-side{background:#fff;border:1px solid #eee;padding:6px;max-height:calc(100vh - 240px);overflow-y:auto;position:sticky;top:80px}
.cd-side-group{font-size:13px;font-weight:700;padding:8px 12px;margin:6px 0 4px;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
.cd-side-group .grp-n{font-size:11px;font-weight:600;opacity:.8}
.cd-side-group:first-child{margin-top:0}
.cd-side-group.g-재고소진{background:#FFEFEF;color:var(--brand)}
.cd-side-group.g-단종예정{background:#FFF4E5;color:#cc7a00}
.cd-side-group.g-단종검토{background:#FFFBE5;color:#998800}
.cd-side-group.g-폐기{background:#EEE;color:#555}
.cd-side-item{display:block;padding:7px 10px 7px 22px;cursor:pointer;font-size:13px;color:var(--text);border-left:3px solid transparent;position:relative}
.cd-side-item::before{content:'·';position:absolute;left:12px;top:7px;color:#bbb}
.cd-side-item .n{float:right;color:var(--text-sub);font-size:11px}
.cd-side-item.active{font-weight:600}
.cd-side-item.g-재고소진:hover,.cd-side-item.g-재고소진.active{background:#FFEFEF;color:var(--brand);border-left-color:var(--brand)}
.cd-side-item.g-재고소진.active::before,.cd-side-item.g-재고소진.active .n{color:var(--brand)}
.cd-side-item.g-단종예정:hover,.cd-side-item.g-단종예정.active{background:#FFF4E5;color:#cc7a00;border-left-color:#cc7a00}
.cd-side-item.g-단종예정.active::before,.cd-side-item.g-단종예정.active .n{color:#cc7a00}
.cd-side-item.g-단종검토:hover,.cd-side-item.g-단종검토.active{background:#FFFBE5;color:#998800;border-left-color:#998800}
.cd-side-item.g-단종검토.active::before,.cd-side-item.g-단종검토.active .n{color:#998800}
.cd-side-item.g-폐기:hover,.cd-side-item.g-폐기.active{background:#EEE;color:var(--text);border-left-color:#666}
.cd-side-item.g-폐기.active::before,.cd-side-item.g-폐기.active .n{color:#555}

.cd-main{background:#fff;border:1px solid #eee;min-height:400px}
.cd-empty{padding:60px;text-align:center;color:var(--text-sub);font-size:14px}
.cd-summary-bar{padding:12px 16px;background:var(--bg-alt);border-bottom:1px solid #eee;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.cd-table-wrap{overflow-x:auto;max-height:calc(100vh - 280px);overflow-y:auto}
table.cd-table{width:100%;border-collapse:collapse;font-size:12px}
.cd-table th,.cd-table td{padding:8px 10px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
.cd-table th{background:var(--bg-alt);color:var(--text);font-weight:600;text-align:center;border-bottom:2px solid var(--brand);position:sticky;top:0;z-index:1}
.cd-table td.left{text-align:left}
.cd-table tr:hover{background:#FFF8F8}
.cd-table .badge-Y{background:#FFEFEF;color:var(--brand);padding:2px 6px;font-size:10px;font-weight:600}
.cd-table .num{font-variant-numeric:tabular-nums}
.cd-table tr.filter-row th{padding:4px 6px;background:#FAFAFA;border-bottom:1px solid #ddd;position:sticky;top:34px;z-index:1}
.cd-table tr.filter-row input,.cd-table tr.filter-row select{width:100%;padding:3px 6px;border:1px solid #ccc;font-size:11px;font-family:inherit}
.cd-table tr.filter-row input:focus,.cd-table tr.filter-row select:focus{outline:none;border-color:var(--brand)}
.cd-filter-clear{background:#fff;border:1px solid #999;color:#666;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.cd-filter-clear:hover{background:#666;color:#fff}

/* 월별 */
.mm-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;background:var(--bg-alt);border:1px solid var(--border)}
.mm-toolbar .lbl{font-size:12px;color:var(--text-sub);font-weight:500}
.mm-toolbar select{padding:6px 10px;border:1px solid var(--border);font-size:13px;background:#fff;color:var(--text);font-family:inherit}
.mm-meta{font-size:12px;color:#666;margin-left:auto}
.mm-meta b{color:var(--text);font-weight:600}
table.mm-table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.mm-table th,.mm-table td{padding:10px 12px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
.mm-table th{background:var(--bg-alt);color:var(--text);font-weight:600;text-align:center;border-bottom:2px solid var(--brand)}
.mm-table th.left,.mm-table td.left{text-align:left}
.mm-table tr.row-grp-0{background:#fff}
.mm-table tr.row-grp-1{background:#FCFCFC}
.mm-table tr.row-subtotal td{font-weight:600;background:#F4F4F4;color:#666;border-top:1px dashed #ccc}
.mm-table tr.row-total td{font-weight:700;background:var(--bg-alt);border-top:2px solid var(--brand)}
.mm-table .diff-up{color:var(--brand);font-weight:600}
.mm-table .diff-down{color:#0a7d3a;font-weight:600}
.mm-table .diff-zero{color:var(--text-sub)}
.mm-table tr.row-removed{background:#FAFAFA !important}
.mm-table tr.row-removed td.left{color:var(--text-sub)}
.badge{display:inline-block;padding:1px 7px;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.3px;vertical-align:1px}
.badge-new{background:#E8F4FF;color:#0066CC;border:1px solid #99C9F0}
.badge-removed{background:#F4F4F4;color:#666;border:1px solid #CCC;text-decoration:line-through}
.subtotal-chg{font-size:11px;font-weight:500;color:#666;margin-left:8px}
.subtotal-chg .new{color:#0066CC}
.subtotal-chg .removed{color:#999}
.mm-empty{padding:60px;text-align:center;color:var(--text-sub);font-size:14px;background:#fff;border:1px solid var(--border)}
</style>
</head>

<script>
const SUMMARY  = JSON.parse(document.getElementById('summary-data').textContent);
const ITEMS    = JSON.parse(document.getElementById('items-data').textContent);
const STATS    = JSON.parse(document.getElementById('stats-data').textContent);
const MONTHS   = JSON.parse(document.getElementById('months-data').textContent);
const COMPARES = JSON.parse(document.getElementById('compares-data').textContent);

function fmt(n){ return (Number(n) || 0).toLocaleString('ko-KR'); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ──────────────────────────────────────────────────────────────────────────────
// 탭 전환
// ──────────────────────────────────────────────────────────────────────────────
document.querySelectorAll('.cm-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const panel = btn.dataset.panel;
    document.querySelectorAll('.cm-tab').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.cm-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + panel));
  });
});

// ──────────────────────────────────────────────────────────────────────────────
// 종합
// ──────────────────────────────────────────────────────────────────────────────
function renderSummary(){
  const panel = document.getElementById('panel-summary');
  let html = '';

  html += `<div class="cm-status">✓ 분류 완료: <b>${fmt(STATS.분류건수 || 0)}</b>건 / 전체 inv 캐시 ${fmt(STATS.전체단품 || 0)}건 · 미분류 단종예정 잔여 ${STATS.단종예정_raw_미분류 || 0}건 · 관리대상 inv 밖 ${STATS.관리대상_inv밖 || 0}건</div>`;

  html += `<table class="cum-table">
    <thead><tr>
      <th class="left" style="width:110px;">구분1</th>
      <th class="left">구분2</th>
      <th style="width:100px;">품목수</th>
      <th style="width:120px;">가용재고</th>
      <th style="width:160px;">가용금액(원)</th>
    </tr></thead><tbody>`;

  let prev_g1 = '';
  let group_idx = 0;
  let sub = {n:0, s:0, a:0};
  let total = {n:0, s:0, a:0};
  const rows = [];

  for(let i = 0; i < SUMMARY.length; i++){
    const r = SUMMARY[i];
    if(r.구분1 !== prev_g1){
      if(prev_g1){
        rows.push(`<tr class="row-subtotal">
          <td class="left">${esc(prev_g1)} 소계</td><td></td>
          <td>${fmt(sub.n)}</td><td>${fmt(sub.s)}</td><td>${fmt(sub.a)}</td></tr>`);
      }
      sub = {n:0, s:0, a:0};
      group_idx++;
    }
    rows.push(`<tr class="row-grp-${group_idx % 2}" data-g1="${esc(r.구분1)}" data-g2="${esc(r.구분2)}" onclick="gotoDetail('${esc(r.구분1)}', '${esc(r.구분2)}')">
      <td class="left"><span class="cat-g1 g1-${esc(r.구분1)}">${esc(r.구분1)}</span></td>
      <td class="left">${esc(r.구분2)}</td>
      <td>${fmt(r.품목수)}</td><td>${fmt(r.가용재고)}</td><td>${fmt(r.가용금액)}</td></tr>`);
    sub.n += r.품목수; sub.s += r.가용재고; sub.a += r.가용금액;
    total.n += r.품목수; total.s += r.가용재고; total.a += r.가용금액;
    prev_g1 = r.구분1;
  }
  if(prev_g1){
    rows.push(`<tr class="row-subtotal">
      <td class="left">${esc(prev_g1)} 소계</td><td></td>
      <td>${fmt(sub.n)}</td><td>${fmt(sub.s)}</td><td>${fmt(sub.a)}</td></tr>`);
  }
  rows.push(`<tr class="row-total">
    <td class="left" colspan="2">합계</td>
    <td>${fmt(total.n)}</td><td>${fmt(total.s)}</td><td>${fmt(total.a)}</td></tr>`);

  html += rows.join('') + '</tbody></table>';
  html += `<div style="margin-top:12px;font-size:12px;color:#999">※ 표 행 클릭 → 해당 카테고리 상세로 이동</div>`;
  html += `<div style="margin-top:8px;"><button class="cd-btn" onclick="downloadAllExcel()">전체 엑셀 다운로드</button></div>`;
  panel.innerHTML = html;
}

function gotoDetail(g1, g2){
  // 상세 탭 활성화 + 해당 카테고리 선택
  document.querySelector('.cm-tab[data-panel="detail"]').click();
  setTimeout(() => selectDetailCategory(g1, g2), 50);
}

// ──────────────────────────────────────────────────────────────────────────────
// 상세
// ──────────────────────────────────────────────────────────────────────────────
let _currentDetail = {g1: '', g2: '', items: []};
const _colFilters = {단품코드:'', 색상:'', 단품명칭:'', 시리즈:'', 사용구분:'', 단종예정:'', 용도구분:''};
let _searchText = '';

function renderDetailShell(){
  const panel = document.getElementById('panel-detail');
  const groups = ['재고소진', '단종예정', '단종검토', '폐기'];
  const grpTotals = {};
  SUMMARY.forEach(r => {
    grpTotals[r.구분1] = (grpTotals[r.구분1] || 0) + r.품목수;
  });

  let sideHtml = '';
  for(const grp of groups){
    const inGrp = SUMMARY.filter(r => r.구분1 === grp);
    if(inGrp.length === 0) continue;
    sideHtml += `<div class="cd-side-group g-${grp}"><span>${grp}</span><span class="grp-n">${fmt(grpTotals[grp])}</span></div>`;
    for(const r of inGrp){
      const g2short = r.구분2.length > 28 ? r.구분2.slice(0, 28) + '…' : r.구분2;
      sideHtml += `<a class="cd-side-item g-${grp}" data-g1="${esc(grp)}" data-g2="${esc(r.구분2)}">${esc(g2short)}<span class="n">${fmt(r.품목수)}</span></a>`;
    }
  }

  panel.innerHTML = `
    <div class="cd-toolbar">
      <input type="text" id="cd-search" placeholder="단품코드 · 명칭 · 시리즈 검색...">
      <button class="cd-btn" onclick="downloadCurrentExcel()">선택 카테고리 엑셀</button>
      <button class="cd-btn ghost" onclick="downloadAllExcel()">전체 엑셀</button>

    <div class="cd-layout">
      <aside class="cd-side" id="cd-side">${sideHtml}</aside>
      <section class="cd-main" id="cd-main"><div class="cd-empty">← 좌측 카테고리를 선택하세요</div></section>
    </div>`;

  document.getElementById('cd-side').addEventListener('click', e => {
    const a = e.target.closest('.cd-side-item');
    if(!a) return;
    selectDetailCategory(a.dataset.g1, a.dataset.g2);
  });
  document.getElementById('cd-search').addEventListener('input', e => {
    _searchText = e.target.value.trim().toLowerCase();
    renderDetailRows();
  });
}

function selectDetailCategory(g1, g2){
  const side = document.getElementById('cd-side');
  if(!side) return;
  side.querySelectorAll('.cd-side-item').forEach(el => el.classList.remove('active'));
  const target = side.querySelector(`.cd-side-item[data-g1="${g1}"][data-g2="${cssEsc(g2)}"]`);
  if(target){
    target.classList.add('active');
    target.scrollIntoView({block: 'center', behavior: 'instant'});
  }
  _currentDetail.g1 = g1;
  _currentDetail.g2 = g2;
  _currentDetail.items = ITEMS[`${g1}__${g2}`] || [];
  Object.keys(_colFilters).forEach(k => _colFilters[k] = '');
  _searchText = '';
  const search = document.getElementById('cd-search');
  if(search) search.value = '';
  renderDetailMain();
}

function cssEsc(s){ return String(s).replace(/(["\\])/g, '\\$1'); }

function applyDetailFilters(){
  return _currentDetail.items.filter(r => {
    if(_searchText && ![r.단품코드, r.단품명칭, r.시리즈].some(v => String(v).toLowerCase().includes(_searchText))) return false;
    if(_colFilters.단품코드 && !String(r.단품코드).toLowerCase().includes(_colFilters.단품코드.toLowerCase())) return false;
    if(_colFilters.색상 && !String(r.색상).toLowerCase().includes(_colFilters.색상.toLowerCase())) return false;
    if(_colFilters.단품명칭 && !String(r.단품명칭).toLowerCase().includes(_colFilters.단품명칭.toLowerCase())) return false;
    if(_colFilters.시리즈 && r.시리즈 !== _colFilters.시리즈) return false;
    if(_colFilters.사용구분 && r.사용구분 !== _colFilters.사용구분) return false;
    if(_colFilters.단종예정 && r.단종예정 !== _colFilters.단종예정) return false;
    if(_colFilters.용도구분 && r.용도구분 !== _colFilters.용도구분) return false;
    return true;
  });
}

function uniq(arr){
  return [...new Set(arr.filter(v => v != null && v !== ''))].sort();
}

function renderDetailMain(){
  const main = document.getElementById('cd-main');
  if(!_currentDetail.items.length){
    main.innerHTML = '<div class="cd-empty">단품 없음</div>';
    return;
  }
  const seriesOpts = uniq(_currentDetail.items.map(r => r.시리즈));
  const usageOpts  = uniq(_currentDetail.items.map(r => r.사용구분));
  const discOpts   = uniq(_currentDetail.items.map(r => r.단종예정));
  const purpOpts   = uniq(_currentDetail.items.map(r => r.용도구분));

  const filtered = applyDetailFilters();
  const totalStock = filtered.reduce((s, r) => s + r.가용재고, 0);
  const totalAmt = filtered.reduce((s, r) => s + r.재고금액, 0);

  const opt = (arr, sel) => arr.map(o => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('');

  main.innerHTML = `
    <div class="cd-summary-bar">
      <div>
        <span class="cat-g1 g1-${esc(_currentDetail.g1)}">${esc(_currentDetail.g1)}</span>
        <b>${esc(_currentDetail.g2)}</b>
        <span style="color:#999;margin-left:8px;">${fmt(filtered.length)} / ${fmt(_currentDetail.items.length)}건 · 가용재고 ${fmt(totalStock)} · 가용금액 ${fmt(totalAmt)}원</span>
      </div>
      <div><button class="cd-filter-clear" onclick="clearColFilters()">필터 초기화</button></div>
    </div>
    <div class="cd-table-wrap">
      <table class="cd-table">
        <thead>
          <tr>
            <th style="width:120px;">단품코드</th><th style="width:60px;">색상</th>
            <th>단품명</th><th style="width:120px;">시리즈</th>
            <th style="width:70px;">사용</th><th style="width:60px;">단종</th>
            <th style="width:120px;">용도구분</th>
            <th style="width:90px;">가용재고</th><th style="width:120px;">가용금액</th>
          </tr>
          <tr class="filter-row">
            <th><input data-col="단품코드" placeholder="필터..." value="${esc(_colFilters.단품코드)}"></th>
            <th><input data-col="색상" placeholder="필터..." value="${esc(_colFilters.색상)}"></th>
            <th><input data-col="단품명칭" placeholder="필터..." value="${esc(_colFilters.단품명칭)}"></th>
            <th><select data-col="시리즈"><option value="">(전체)</option>${opt(seriesOpts, _colFilters.시리즈)}</select></th>
            <th><select data-col="사용구분"><option value="">(전체)</option>${opt(usageOpts, _colFilters.사용구분)}</select></th>
            <th><select data-col="단종예정"><option value="">(전체)</option>${opt(discOpts, _colFilters.단종예정)}</select></th>
            <th><select data-col="용도구분"><option value="">(전체)</option>${opt(purpOpts, _colFilters.용도구분)}</select></th>
            <th></th><th></th>
          </tr>
        </thead>
        <tbody>${renderDetailRowsHtml(filtered)}</tbody>
      </table>
    </div>`;

  main.querySelectorAll('tr.filter-row input').forEach(el => {
    el.addEventListener('input', () => { _colFilters[el.dataset.col] = el.value; renderDetailRows(); });
  });
  main.querySelectorAll('tr.filter-row select').forEach(el => {
    el.addEventListener('change', () => { _colFilters[el.dataset.col] = el.value; renderDetailRows(); });
  });
}

function renderDetailRowsHtml(filtered){
  return filtered.map(r => `
    <tr>
      <td class="left num">${esc(r.단품코드)}</td>
      <td class="num">${esc(r.색상)}</td>
      <td class="left">${esc(r.단품명칭)}</td>
      <td class="left">${esc(r.시리즈)}</td>
      <td>${esc(r.사용구분)}</td>
      <td>${r.단종예정 === 'Y' ? '<span class="badge-Y">Y</span>' : esc(r.단종예정)}</td>
      <td class="left">${esc(r.용도구분)}</td>
      <td class="num">${fmt(r.가용재고)}</td>
      <td class="num">${fmt(r.재고금액)}</td>
    </tr>`).join('');
}

function renderDetailRows(){
  const filtered = applyDetailFilters();
  const tbody = document.querySelector('#panel-detail table.cd-table tbody');
  if(!tbody) return;
  tbody.innerHTML = renderDetailRowsHtml(filtered);
  const totalStock = filtered.reduce((s, r) => s + r.가용재고, 0);
  const totalAmt = filtered.reduce((s, r) => s + r.재고금액, 0);
  const span = document.querySelector('#panel-detail .cd-summary-bar > div span');
  if(span){
    span.textContent = `${fmt(filtered.length)} / ${fmt(_currentDetail.items.length)}건 · 가용재고 ${fmt(totalStock)} · 가용금액 ${fmt(totalAmt)}원`;
  }
}

function clearColFilters(){
  Object.keys(_colFilters).forEach(k => _colFilters[k] = '');
  _searchText = '';
  const search = document.getElementById('cd-search');
  if(search) search.value = '';
  renderDetailMain();
}

// ──────────────────────────────────────────────────────────────────────────────
// 월별
// ──────────────────────────────────────────────────────────────────────────────
function renderMonthlyShell(){
  const panel = document.getElementById('panel-monthly');
  let opts = '';
  if(MONTHS.length === 0){
    opts = `<option value="${esc(window.__DEFAULT_YM)}">${esc(window.__DEFAULT_YM)} (스냅샷 없음)</option>`;
  } else {
    opts = MONTHS.map((m, i) => `<option value="${esc(m.ym)}"${i === 0 ? ' selected' : ''}>${esc(m.ym)}</option>`).join('');
  }
  panel.innerHTML = `
    <div class="mm-toolbar">
      <span class="lbl">기준 월</span>
      <select id="mm-ym">${opts}</select>
      <span class="mm-meta" id="mm-meta"></span>
    </div>
    <div id="mm-content"></div>`;
  document.getElementById('mm-ym').addEventListener('change', e => renderMonthlyContent(e.target.value));
  if(MONTHS.length > 0){
    renderMonthlyContent(MONTHS[0].ym);
  } else {
    document.getElementById('mm-content').innerHTML = `<div class="mm-empty">적재된 월별 스냅샷이 없습니다.</div>`;
  }
}

function renderMonthlyContent(ym){
  const cmp = COMPARES[ym];
  const content = document.getElementById('mm-content');
  const metaEl = document.getElementById('mm-meta');
  if(!cmp || !cmp.rows || cmp.rows.length === 0){
    content.innerHTML = `<div class="mm-empty">선택한 월(${esc(ym)})에 적재된 스냅샷이 없습니다.</div>`;
    if(metaEl) metaEl.innerHTML = '';
    return;
  }

  const prevYm = _prevYm(ym);
  if(metaEl){
    const meta = (cmp.meta && cmp.meta.curr) || {};
    metaEl.innerHTML = meta.ref_date
      ? `현월 기준일 <b>${esc(meta.ref_date)}</b>${meta.saved_at ? ' · 적재 ' + esc(meta.saved_at) : ''}`
      : '';
  }

  let html = `<table class="mm-table">
    <thead><tr>
      <th class="left" style="width:110px;">구분1</th>
      <th class="left">구분2</th>
      <th>전월(${esc(prevYm || '-')}) 가용금액</th>
      <th>현월(${esc(ym)}) 가용금액</th>
      <th>전월대비</th>
      <th>현월 품목수</th>
      <th>현월 가용재고</th>
    </tr></thead><tbody>`;

  let prev_g1 = '';
  let group_idx = 0;
  let sub = {p:0, c:0, n:0, s:0};
  let total = {p:0, c:0, n:0, s:0};
  const diffHtml = (d) => {
    if(d > 0) return `<td class="diff-up">▲ ${fmt(d)}</td>`;
    if(d < 0) return `<td class="diff-down">▼ ${fmt(-d)}</td>`;
    return `<td class="diff-zero">-</td>`;
  };
  const g1Changes = cmp.g1_changes || {};
  const chgHtml = (g1) => {
    const chg = g1Changes[g1];
    if(!chg) return '';
    const parts = [];
    if(chg.신규) parts.push(`<span class="new">신규 ${chg.신규}건</span>`);
    if(chg.제외) parts.push(`<span class="removed">제외 ${chg.제외}건</span>`);
    return parts.length ? ` <span class="subtotal-chg">(${parts.join(' / ')})</span>` : '';
  };

  for(const r of cmp.rows){
    if(r.구분1 !== prev_g1){
      if(prev_g1){
        html += `<tr class="row-subtotal">
          <td class="left">${esc(prev_g1)} 소계${chgHtml(prev_g1)}</td><td></td>
          <td>${fmt(sub.p)}</td><td>${fmt(sub.c)}</td>
          ${diffHtml(sub.c - sub.p)}
          <td>${fmt(sub.n)}</td><td>${fmt(sub.s)}</td></tr>`;
      }
      sub = {p:0, c:0, n:0, s:0};
      group_idx++;
    }
    const removedCls = r.is_removed ? ' row-removed' : '';
    const newBadge = r.is_new ? `<span class="badge badge-new">신규</span>` : '';
    const remBadge = r.is_removed ? `<span class="badge badge-removed">제외</span>` : '';
    html += `<tr class="row-grp-${group_idx % 2}${removedCls}">
      <td class="left"><span class="cat-g1 g1-${esc(r.구분1)}">${esc(r.구분1)}</span></td>
      <td class="left">${esc(r.구분2)} ${newBadge} ${remBadge}</td>
      <td>${fmt(r.prev.가용금액)}</td>
      <td>${fmt(r.curr.가용금액)}</td>
      ${diffHtml(r.diff_가용금액)}
      <td>${fmt(r.curr.품목수)}</td>
      <td>${fmt(r.curr.가용재고)}</td></tr>`;
    total.p += r.prev.가용금액; total.c += r.curr.가용금액;
    total.n += r.curr.품목수;  total.s += r.curr.가용재고;
    sub.p += r.prev.가용금액;  sub.c += r.curr.가용금액;
    sub.n += r.curr.품목수;    sub.s += r.curr.가용재고;
    prev_g1 = r.구분1;
  }
  if(prev_g1){
    html += `<tr class="row-subtotal">
      <td class="left">${esc(prev_g1)} 소계${chgHtml(prev_g1)}</td><td></td>
      <td>${fmt(sub.p)}</td><td>${fmt(sub.c)}</td>
      ${diffHtml(sub.c - sub.p)}
      <td>${fmt(sub.n)}</td><td>${fmt(sub.s)}</td></tr>`;
  }
  html += `<tr class="row-total">
    <td class="left" colspan="2">합계</td>
    <td>${fmt(total.p)}</td><td>${fmt(total.c)}</td>
    ${diffHtml(total.c - total.p)}
    <td>${fmt(total.n)}</td><td>${fmt(total.s)}</td></tr>`;

  html += '</tbody></table>';
  html += `<div style="margin-top:12px;font-size:12px;color:#999">
    ※ 전월대비 가용금액: 양수(▲, 빨강) = 재고 증가 / 음수(▼, 녹색) = 재고 감소<br>
    ※ <span class="badge badge-new">신규</span> = 전월에 없던 분류 · <span class="badge badge-removed">제외</span> = 이번 달 빠진 분류
  </div>`;
  content.innerHTML = html;
}

function _prevYm(ym){
  if(!ym || ym.indexOf('-') < 0) return '';
  const [y, m] = ym.split('-').map(Number);
  if(m === 1) return `${y-1}-12`;
  return `${y}-${String(m-1).padStart(2, '0')}`;
}

// ──────────────────────────────────────────────────────────────────────────────
// 엑셀 다운로드 (SheetJS)
// ──────────────────────────────────────────────────────────────────────────────
function downloadCurrentExcel(){
  if(!_currentDetail.g1 || !_currentDetail.g2){
    alert('카테고리를 먼저 선택하세요.');
    return;
  }
  const rows = applyDetailFilters();
  const header = ['구분1','구분2','단품코드','색상','조합','단품명칭','시리즈','사용구분','단종예정','용도구분','가용재고','재고금액'];
  const aoa = [header, ...rows.map(r => [
    _currentDetail.g1, _currentDetail.g2,
    r.단품코드, r.색상, r.조합, r.단품명칭, r.시리즈,
    r.사용구분, r.단종예정, r.용도구분, r.가용재고, r.재고금액
  ])];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '누적재고');
  const today = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `누적재고_${_currentDetail.g1}_${_currentDetail.g2}_${today}.xlsx`);
}

function downloadAllExcel(){
  const header = ['구분1','구분2','단품코드','색상','조합','단품명칭','시리즈','사용구분','단종예정','용도구분','가용재고','재고금액'];
  const aoa = [header];
  for(const [key, items] of Object.entries(ITEMS)){
    const [g1, g2] = key.split('__');
    for(const r of items){
      aoa.push([g1, g2, r.단품코드, r.색상, r.조합, r.단품명칭, r.시리즈,
        r.사용구분, r.단종예정, r.용도구분, r.가용재고, r.재고금액]);
    }
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '누적재고');
  const today = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `누적재고_전체_${today}.xlsx`);
}

// ──────────────────────────────────────────────────────────────────────────────
// 초기화
// ──────────────────────────────────────────────────────────────────────────────
renderSummary();
renderDetailShell();
renderMonthlyShell();
</script>
